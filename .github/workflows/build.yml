name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Dobby
        run: git clone --depth 1 https://github.com/jmpews/Dobby external/Dobby

      - name: Build (arm64-v8a)
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Package Magisk module
        run: |
          mkdir -p out/zygisk
          cp build/libcamoverride.so out/zygisk/arm64-v8a.so
          cp module/module.prop out/
          cd out && zip -r ../CameraOverride-zygisk.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: CameraOverride-zygisk
          path: CameraOverride-zygisk.zip
